kind = "web"
previewPath = "/"
title = "Opero"
description = "The Opero public website and management portal for content, inquiries, and surveys."
version = "1.0.0"
id = "artifacts/opero-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25786

[services.development]
run = "pnpm --filter @workspace/opero-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/opero-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/opero-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25786"
BASE_PATH = "/"
